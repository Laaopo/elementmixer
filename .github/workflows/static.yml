<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Element Mixer</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2e;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #6366f1;
            --border: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px 16px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
        }
        h2 {
            color: #c7d2fe;
            font-size: 1.3rem;
            margin-top: 28px;
            margin-bottom: 12px;
        }
        p, li {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        strong {
            color: var(--text-primary);
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .effective-date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .highlight-box {
            background-color: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--accent);
            padding: 12px 16px;
            margin: 16px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Privacy Policy for Element Mixer</h1>
        <div class="effective-date">Effective Date: October 22, 2026</div>

        <p>This Privacy Policy explains how <strong>Element Mixer</strong> ("we", "us", or "our") handles user information when you install and play the Element Mixer mobile application.</p>

        <h2>1. Overview and Core Principles</h2>
        <p>Element Mixer is an element-crafting and alchemy puzzle game designed for fun and entertainment. We believe in minimal data collection: <strong>we do not operate our own private user-tracking servers, and we do not collect personal identifiers such as your real name, physical address, or phone number.</strong></p>

        <h2>2. Data Stored Locally on Your Device</h2>
        <p>The game stores your gameplay progress, unlocked elements, crafted recipes, and sound/audio preferences locally on your device via standard local app storage (SharedPreferences). This data remains exclusively on your device and is not uploaded to our own servers.</p>

        <h2>3. Third-Party Services and SDKs</h2>
        <p>To provide advertising, app updates, and game functionality, Element Mixer utilizes trusted third-party SDKs provided by Google. These third-party services may collect device identifiers and usage data as outlined below:</p>

        <h3>A. Google AdMob (Google Mobile Ads SDK)</h3>
        <p>We use Google AdMob to display in-game banner advertisements. In order to serve ads, measure ad performance, and protect against fraudulent activity, Google AdMob may automatically collect and process:</p>
        <ul>
            <li><strong>Device or other IDs:</strong> Android Advertising ID (AAID / AD_ID) and app set identifiers.</li>
            <li><strong>App Activity & Interactions:</strong> Ad views, clicks, and interactions.</li>
            <li><strong>Diagnostics & Performance:</strong> Crash reports and SDK diagnostic data.</li>
        </ul>
        <div class="highlight-box">
            You can review Google's AdMob privacy practices and controls at: <br>
            <a href="https://policies.google.com/technologies/ads" target="_blank" rel="noopener noreferrer">Google Advertising & Privacy Policy</a>
        </div>

        <h3>B. Google Play Services & In-App Updates</h3>
        <p>The application uses Google Play Services to check for newer app updates directly from the Google Play Store, ensuring optimal security and features.</p>

        <h2>4. How to Manage or Reset Device Identifiers</h2>
        <p>You have control over how your advertising identifier is used on your Android device. You can reset or delete your Advertising ID at any time through your Android device settings:</p>
        <ul>
            <li>Go to <strong>Settings</strong> &gt; <strong>Privacy</strong> &gt; <strong>Ads</strong> (or <strong>Settings</strong> &gt; <strong>Google</strong> &gt; <strong>Ads</strong>).</li>
            <li>Tap <strong>Reset advertising ID</strong> or <strong>Delete advertising ID</strong> to opt out of personalized ad tracking.</li>
        </ul>

        <h2>5. Children's Privacy</h2>
        <p>Element Mixer is intended for a general audience. We do not knowingly collect personally identifiable information from children under the age of 13. If you believe that a child has provided personal information to us, please contact us immediately so we can take appropriate measures.</p>

        <h2>6. Security and Data Transmission</h2>
        <p>All network communications performed by integrated third-party SDKs (such as Google Mobile Ads) use standard industry-grade HTTPS/TLS encryption in transit.</p>

        <h2>7. Changes to This Privacy Policy</h2>
        <p>We may update our Privacy Policy periodically. Any changes will be posted on this page with an updated effective date. You are advised to review this page periodically for any updates.</p>

        <h2>8. Contact Us</h2>
        <p>If you have questions, concerns, or requests regarding this Privacy Policy or data handling in Element Mixer, please contact us at:</p>
        <p><strong>Email:</strong> <a href="mailto:support@elementmixer.app">support@elementmixer.app</a> (or your developer contact email)</p>
    </div>
</body>
</html>
